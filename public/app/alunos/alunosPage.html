<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJORCLASSAPP - INITIALPAGE</title>
    <link rel="stylesheet" href="../css/appStyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body onload="exibirAlunos()">
    <div class="header">
        <img src="../../img/LOGOIMAGE_INVERTIDO.png" alt="" onclick="window.location.href='../initialPage.html'">
        <div class="linksContainer">
            <div class="navBarLink">
                <a href="">
                    <img src="../../img/User/Users.png" alt="">
                    <p>ALUNOS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../aulas/aulasPage.html">
                    <img src="../../img/Calendar/Calendar_Days.svg" alt="">
                    <p>AULAS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../relatorios/qtdAlunos.html">
                    <img src="../../img/Interface/Chart_Line.svg" alt="">
                    <p>RELATÓRIOS</p>
                </a>
            </div>
            <div class="exitButton">
                <a href="../../index.html">
                    <img src="../../img/Vector.png" alt="">
                    <span>SAIR</span>
                </a>
            </div>
        </div>
    </div>
    <div class="mainSection">
        <div class="topItens">
            <p>
                Meus alunos:
            </p>
            <div class="filterSection">
                <img src="../../img/Interface/Filter.svg" alt="">
                <span>Filtrar por:</span>
                <select name="" id=""></select>
            </div>
            <div class="addButton">
                <a href="cadastroAlunosPage.html">
                    <img src="../../img/Edit/Add_Plus_Circle.svg" alt="">
                    <span>Adicionar alunos</span>
                </a>
            </div>
        </div>
        <div class="containerAlunos" id="cardAlunos">

        </div>
    </div>
</body>

</html>
<script>
    function alunoHistorico(idAluno){
        sessionStorage.ID_ALUNO_HISTORICO = idAluno
        console.log("Id do aluno: ", idAluno)
        window.location.href='historicoAlunoPage.html'
    }

    function removerAluno(idAluno){
        sessionStorage.ID_ALUNO_REMOVER = idAluno
        console.log("Id do aluno: ", idAluno)
        window.location.href='removeAlunoPage.html'
    }

    function editarAluno(idAluno){
        sessionStorage.ID_ALUNO_EDITAR   = idAluno
        console.log("Id do aluno: ", idAluno)
        window.location.href='editAlunosPage.html'
    }

    function exibirAlunos() {
        fetch(`/alunos/getAlunos/${sessionStorage.ID_USUARIO}`).then(response =>{
            if(response.ok){
                response.json().then(resposta =>{
                    for(i=0; i<resposta.length; i++){
                            document.getElementById("cardAlunos").innerHTML += `
                                <div class="divAluno">
                                    <div class="topoAluno">
                                        <p onclick="alunoHistorico(${resposta[i].idAluno})">${resposta[i].nome}</p>
                                        <div class="imgsContainer">
                                            <img onclick="removerAluno(${resposta[i].idAluno})"
                                                src="../../img/Edit/Remove_Minus_Circle.svg" alt="">
                                            <img onclick="editarAluno(${resposta[i].idAluno})" src="../../img/Edit/Edit_Pencil_01.svg" alt="">
                                        </div>
                                    </div>
                                    <div class="alunoBottom">
                                        <p>Instrumento: <span>${resposta[i].instrumento}</span></p>
                                        <p>Telefone: <span>${resposta[i].telefone}</span></p>
                                    </div>
                                </div>
                                `
                    }
                })
            }
        })
    }
</script>
