<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJORCLASSAPP - INITIALPAGE</title>
    <link rel="stylesheet" href="../css/appStyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<script src="../../js/script.js"></script>

<body onload="buscarInstrumentos()">
    <div class="header">
        <img src="../../img/LOGOIMAGE_INVERTIDO.png" alt="" onclick="window.location.href='../initialPage.html'">
        <div class="linksContainer">
            <div class="navBarLink">
                <a href="alunosPage.html">
                    <img src="../../img/User/Users.png" alt="">
                    <p>ALUNOS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../aulas/aulasPage.html">
                    <img src="../../img/Calendar/Calendar_Days.svg" alt="">
                    <p>AULAS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../relatorios/qtdAlunos.html">
                    <img src="../../img/Interface/Chart_Line.svg" alt="">
                    <p>RELATÓRIOS</p>
                </a>
            </div>
            <div class="exitButton">
                <a href="../../index.html">
                    <img src="../../img/Vector.png" alt="">
                    <span>SAIR</span>
                </a>
            </div>
        </div>
    </div>
    <div class="mainContent">
        <h1>
            EDITAR ALUNO
        </h1>
        <div class="registerForm formCadastro">
            <div class="inputContainer">
                <div class="inputField">
                    <p>Email: </p>
                    <input type="text" placeholder="email@exemplo.com" id="emailInp">
                </div>
                <div class="inputField">
                    <p>Telefone: </p>
                    <input type="text" placeholder="11987654321" id="telefoneInp">
                </div>
                <div class="inputField">
                    <p>Instrumento: </p>
                    <select name="" id="selectInstrumento">
                    </select>
                </div>
            </div>
            <button onclick="editarAluno()">EDITAR ALUNO</button>
        </div>
    </div>
</body>
</html>
<script>
    function editarAluno(){
        let emailVar = emailInp.value
        let telefoneVar = telefoneInp.value
        let instrumentoVar = selectInstrumento.value

        let idAluno = sessionStorage.ID_ALUNO_EDITAR
        fetch(`/alunos/editarAluno/${idAluno}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                telefoneServer: telefoneVar,
                instrumentoServer: instrumentoVar
            })
        }).then(response=>{
            if(response.ok){
                alert(`O aluno foi editado com sucesso`)
                window.location.href='alunosPage.html'
            }else{
                throw ("Houve um erro ao editar o aluno")
            }
        }).catch(error=>{
            console.error('Deu erro: ', error)
        });
    }
</script>
