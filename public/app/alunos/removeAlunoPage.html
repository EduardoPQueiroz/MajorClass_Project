<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJORCLASSAPP - INITIALPAGE</title>
    <link rel="stylesheet" href="../css/appStyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="header">
        <img src="../../img/LOGOIMAGE_INVERTIDO.png" alt="" onclick="window.location.href='../initialPage.html'">
        <div class="linksContainer">
            <div class="navBarLink">
                <a href="alunosPage.html">
                    <img src="../../img/User/Users.png" alt="">
                    <p>ALUNOS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../aulas/aulasPage.html">
                    <img src="../../img/Calendar/Calendar_Days.svg" alt="">
                    <p>AULAS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../relatorios/qtdAlunos.html">
                    <img src="../../img/Interface/Chart_Line.svg" alt="">
                    <p>RELATÓRIOS</p>
                </a>
            </div>
            <div class="exitButton">
                <a href="../../index.html">
                    <img src="../../img/Vector.png" alt="">
                    <span>SAIR</span>
                </a>
            </div>
        </div>
    </div>
    <div class="mainContent">
        <h1>
            REMOVER ALUNO
        </h1>
        <div class="registerForm removeCard">
            <p>VOCÊ TEM CERTEZA QUE DESEJA REMOVER ESSE ALUNO?</p>
            <div class="btnsContainer">
                <button id="btnCancelar" onclick="window.location.href='alunosPage.html'">CANCELAR</button>
                <button id="btnRemover" onclick="removerAluno()">REMOVER ALUNO</button>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    function removerAluno(){
        idAluno = sessionStorage.ID_ALUNO_REMOVER
        fetch(`/alunos/removerAluno/${idAluno}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            }
        }).then(response =>{
            if(response.ok){
                alert(`O aluno foi removido`)
                window.location.href='alunosPage.html'
            }else{
                throw ("Houve um erro ao tentar deletar o aluno")
            }
        }).catch(error=>{
            console.error("Houve um erro: ", error)
        })
    }
</script>
