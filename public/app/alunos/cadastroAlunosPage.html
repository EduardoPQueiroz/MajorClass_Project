<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJORCLASSAPP - INITIALPAGE</title>
    <link rel="stylesheet" href="../css/appStyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<script src="../../js/script.js"></script>
<body onload="buscarInstrumentos()">
    <div class="header">
        <img src="../../img/LOGOIMAGE_INVERTIDO.png" alt="" onclick="window.location.href='../initialPage.html'">
        <div class="linksContainer">
            <div class="navBarLink">
                <a href="alunosPage.html">
                    <img src="../../img/User/Users.png" alt="">
                    <p>ALUNOS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../aulas/aulasPage.html">
                    <img src="../../img/Calendar/Calendar_Days.svg" alt="">
                    <p>AULAS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../relatorios/qtdAlunos.html">
                    <img src="../../img/Interface/Chart_Line.svg" alt="">
                    <p>RELATÓRIOS</p>
                </a>
            </div>
            <div class="exitButton">
                <a href="../../index.html">
                    <img src="../../img/Vector.png" alt="">
                    <span>SAIR</span>
                </a>
            </div>
        </div>
    </div>
    <div class="mainRegister">
        <h1>
            ADICIONAR ALUNO
        </h1>
        <div class="registerForm">
            <div class="inputContainer">
                <div class="inputField">
                    <p>Nome completo: </p>
                    <input type="text" placeholder="Nome Sobrenome" id="nameInput">
                </div>
                <div class="inputField">
                    <p>Sexo: </p>
                    <select name="" id="selectSexo">
                        <option value="M">Masculino</option>
                        <option value="F">Feminino</option>
                        <option value="O">Outro</option>
                    </select>
                </div>
                <div class="inputField">
                    <p>Email: </p>
                    <input type="text" placeholder="email@exemplo.com" id="emailInput">
                </div>
                <div class="inputField">
                    <p>Telefone: </p>
                    <input type="text" placeholder="11987654321" id="telefoneInput">
                </div>
                <div class="inputField">
                    <p>Instrumento: </p>
                    <select name="" id="selectInstrumento">
                    </select>
                </div>
            </div>
            <button onclick="cadastrarAluno()">ADICIONAR ALUNO</button>
        </div>
    </div>
</body>

</html>
<script>

    function cadastrarAluno() {
        let nomeVar = nameInput.value
        let sexoVar = selectSexo.value
        let emailVar = emailInput.value
        let telefoneVar = telefoneInput.value
        let instrumentoVar = selectInstrumento.value
        let fkProfessorVar = sessionStorage.ID_USUARIO


        fetch("/alunos/cadastrarAluno", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: nomeVar,
                emailServer: emailVar,
                sexoServer: sexoVar,
                telefoneServer: telefoneVar,
                instrumentoServer: instrumentoVar,
                fkProfessorServer: fkProfessorVar
            }),
        }).then(resposta =>{
            console.log("resposta: ", resposta);
            if(resposta.ok){
                alert("Aluno cadastrado com sucesso");
                window.location.href='../alunos/alunosPage.html'
            }else{
                throw "Houve um erro ao realizar o cadastro do aluno"
            }
        }).catch(error => {
            console.log('ERRO: ', error)
        });
    }
</script>
