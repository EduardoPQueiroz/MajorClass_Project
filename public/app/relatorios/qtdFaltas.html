    <div class="header">

<script>
    function obterDadosGrafico() {
        let idProfessor = sessionStorage.ID_USUARIO
        fetch(`/aulas/buscarQtdFaltasMes/${idProfessor}`).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    // resposta.reverse();

                    plotarGrafico(resposta, idProfessor);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        }).catch(function (error) {
            console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
        });
    }

    function plotarGrafico(resposta, idProfessor) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Quantidade de faltas',
                tension: 0.2,
                cubicInterpolationMode: 'monotone',
                data: [],
                borderWidth: 1
            }],
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.mes);
            dados.datasets[0].data.push(registro.numeroFaltas);
        }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config

        let opt = {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                }
            }
        }

        const config = {
            type: 'line',
            data: dados,
            options: opt
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById('chartQtdFaltas'),
            config
        );

    }


    function buscarKpis(){
        let idProfessor = sessionStorage.ID_USUARIO
        let totalAulas = 0
        let qtdFaltas = 0
        fetch(`/aulas/buscarQtdAulasUltimoMes/${idProfessor}`).then(response =>{
            if(response.ok){
                response.json().then(resposta =>{
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    totalAulas = resposta[0].qtdAulas
                    kpiTotalAulasUltimoMes.innerHTML = resposta[0].qtdAulas
                })
            }else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
        });

        fetch(`/aulas/buscarQtdFaltasUltimoMes/${idProfessor}`).then(response =>{
            if(response.ok){
                response.json().then(resposta =>{
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    qtdFaltas = resposta[0].numeroFaltas
                    kpiTotalFaltasUltimoMes.innerHTML = `${((qtdFaltas / totalAulas) * 100).toFixed(2)}%`
                })
            }else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
        });

        fetch(`/aulas/buscarAlunoMaisFaltas/${idProfessor}`).then(response =>{
            if(response.ok){
                response.json().then(resposta =>{
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    kpiAlunoMaisFaltas.innerHTML = resposta[0].nomeAluno
                })
            }else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
        });
    }

</script>
