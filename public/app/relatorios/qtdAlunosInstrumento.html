<script>
    function obterDadosGrafico() {
        let idProfessor = sessionStorage.ID_USUARIO
        fetch(`/alunos/buscarQtdAlunosPorInstrumento/${idProfessor}`).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    // resposta.reverse();

                    plotarGrafico(resposta, idProfessor);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        }).catch(function (error) {
            console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
        });
    }

    function plotarGrafico(resposta, idProfessor) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Quantidade de alunos',
                tension: 0.2,
                cubicInterpolationMode: 'monotone',
                data: [],
                backgroundColor: [
                    'rgba(2, 2, 64, 0.7)',      
                    'rgba(2, 255, 255, 0.5)',   
                    'rgba(0, 127, 255, 0.7)',   
                    'rgba(99, 0, 255, 0.7)',    
                    'rgba(0, 191, 255, 0.7)',   
                    'rgba(30, 144, 255, 0.7)',  
                    'rgba(65, 105, 225, 0.7)',  
                    'rgba(0, 206, 209, 0.6)',   
                    'rgba(70, 130, 180, 0.7)',  
                    'rgba(25, 25, 112, 0.7)',   
                    'rgba(135, 206, 250, 0.6)', 
                    'rgba(72, 61, 139, 0.7)'    
                ],
                borderWidth: 1
            }],
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.nomeInstrumento);
            dados.datasets[0].data.push(registro.qtdAulasInstrumento);
        }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config

        let opt = {
            responsive: true,
            maintainAspectRatio: false,
        }

        const config = {
            type: 'doughnut',
            data: dados,
            options: opt
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById('chartQtdAulasByInstrumento'),
            config
        );

    }

    function buscarKpis(){
        let idProfessor = sessionStorage.ID_USUARIO
        fetch(`/aulas/buscarInstrumentoMaisAulas/${idProfessor}`).then(response =>{
            if(response.ok){
                response.json().then(resposta =>{
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    kpiInstrumentoMaisAulas.innerHTML = resposta[0].nomeInstrumento
                })
            }else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
        });

        fetch(`/aulas/buscarInstrumentoMenosAulas/${idProfessor}`).then(response =>{
            if(response.ok){
                response.json().then(resposta =>{
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    kpiInstrumentoMenosAulas.innerHTML = resposta[0].nomeInstrumento
                })
            }else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
        });



        fetch(`/aulas/buscarInstrumentoMaisAulas/${idProfessor}`).then(response =>{
            if(response.ok){
                response.json().then(resposta =>{
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    kpiMaiorDemanda.innerHTML = resposta[0].qtdAulas
                })
            }else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
        });

    }
