<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJORCLASSAPP - INITIALPAGE</title>
    <link rel="stylesheet" href="../css/appStyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body onload="exibirAulas()">
    <div class="header">
        <img src="../../img/LOGOIMAGE_INVERTIDO.png" alt="" onclick="window.location.href='../initialPage.html'">
        <div class="linksContainer">
            <div class="navBarLink">
                <a href="../alunos/alunosPage.html">
                    <img src="../../img/User/Users.png" alt="">
                    <p>ALUNOS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="">
                    <img src="../../img/Calendar/Calendar_Days.svg" alt="">
                    <p>AULAS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../relatorios/qtdAlunos.html">
                    <img src="../../img/Interface/Chart_Line.svg" alt="">
                    <p>RELATÓRIOS</p>
                </a>
            </div>
            <div class="exitButton">
                <a href="../../index.html">
                    <img src="../../img/Vector.png" alt="">
                    <span>SAIR</span>
                </a>
            </div>
        </div>
    </div>
    <div class="mainSection">
        <div class="topItens">
            <p>
                Próximas aulas:
            </p>
            <div class="filterSection">
                <img src="../../img/Interface/Filter.svg" alt="">
                <span>Filtrar por:</span>
                <select name="" id=""></select>
            </div>
            <div class="addButton">
                <a href="cadastroAulas.html">
                    <img src="../../img/Edit/Add_Plus_Circle.svg" alt="">
                    <span>Adicionar aulas</span>
                </a>
            </div>
        </div>
        <div class="containerAlunos" id="cardAulas">

        </div>
    </div>
</body>

</html>
<script>
    function removerAula(idAula){
        sessionStorage.ID_AULA_REMOVER = idAula
        console.log("Id da aula: ", idAula)
        window.location.href='removeAulaPage.html'
    }

    function exibirAulas() {
        console.log(sessionStorage.ID_USUARIO)
        fetch(`/aulas/getAulasByProfessor/${sessionStorage.ID_USUARIO}`).then(function (resposta) {
            if (resposta.ok) {
                console.log("Dados recebidos: ", JSON.stringify(resposta));
                resposta.json().then(function (resposta) {
                    for(i=0; i<resposta.length; i++){
                        let data = new Date(resposta[i].dataAula)
                        console.log(data)
                        let dataFormatada = data.toLocaleDateString('pt-br')

                        document.getElementById("cardAulas").innerHTML += `
                            <div class="divAluno">
                                <div class="topoAluno">
                                    <div>
                                        <p>${resposta[i].nomeAluno} - ${resposta[i].nomeInstrumento}</p>
                                    </div>
                                    <div class="imgsContainer">
                                        <img onclick="removerAula(${resposta[i].idAula})"
                                            src="../../img/Edit/Remove_Minus_Circle.svg" alt="">
                                        <img onclick="window.location.href='editAulas.html'" src="../../img/Edit/Edit_Pencil_01.svg"
                                            alt="">
                                    </div>
                                </div>
                                <div class="alunoBottom">
                                    <p>Data: <span>${dataFormatada}</span></p>
                                    <p>Hora: <span>${resposta[i].horaAula}</span></p>
                                </div>
                            </div>
                            `
                    };
                });
            } else {
                throw ('Houve um erro na API!');
            }
        }).catch(function (resposta) {
            console.error(resposta);
        });



    }
</script>
