<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJORCLASSAPP - INITIALPAGE</title>
    <link rel="stylesheet" href="../css/appStyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<script src="../../js/script.js"></script>

<body onload="buscarAlunos(), exibirAula()">
    <div class="header">
        <img src="../../img/LOGOIMAGE_INVERTIDO.png" alt="" onclick="window.location.href='../initialPage.html'">
        <div class="linksContainer">
            <div class="navBarLink">
                <a href="../alunos/alunosPage.html">
                    <img src="../../img/User/Users.png" alt="">
                    <p>ALUNOS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="aulasPage.html">
                    <img src="../../img/Calendar/Calendar_Days.svg" alt="">
                    <p>AULAS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../relatorios/qtdAlunos.html">
                    <img src="../../img/Interface/Chart_Line.svg" alt="">
                    <p>RELATÓRIOS</p>
                </a>
            </div>
            <div class="exitButton">
                <a href="../../index.html">
                    <img src="../../img/Vector.png" alt="">
                    <span>SAIR</span>
                </a>
            </div>
        </div>
    </div>
    <div class="mainContent">
        <h1>
            EDITAR AULA
        </h1>
        <div class="registerForm">
            <div class="inputContainer">
                <div class="inputField">
                    <span id="alunoInfo"></span>
                </div>
                <div class="inputField">
                    <p>Aula realizada: </p>
                    <div class="radioSelect">
                        <div class="radioOpt"><input type="radio" name="aulaRealizada" value=1 id="radioSim"
                                onclick="exibirPresenca()""><span>SIM</span></div>
                        <div class=" radioOpt"><input type="radio" name="aulaRealizada" value=0 id="radioNao"
                                onclick="exibirPresenca()"><span>NÃO</span></div>
                    </div>
                </div>
                <div class="inputField" id="inputPresenca" style="display: none;">
                    <p>Presença: </p>
                    <select name="" id="selectPresenca">
                        <option value="PRESENTE">PRESENTE</option>
                        <option value="AUSENTE">AUSENTE</option>
                        <option value="FALTA JUSTIFICADA">FALTA JUSTIFICADA</option>
                    </select>
                </div>
            </div>
            <button onclick="editarAula()">EDITAR AULA</button>
        </div>
    </div>
</body>

</html>
<script>
    function exibirAula(){
        fetch(`/aulas/buscarAulaById/${sessionStorage.ID_AULA_EDITAR}`).then(response=>{
            if(response.ok){
                response.json().then(resposta=>{
                    let data = new Date(resposta[0].dataAula)
                    let dataFormatada = data.toLocaleDateString('pt-br')
                    document.getElementById("alunoInfo").innerHTML += 
                    `<span>${resposta[0].nome}</span> - <span>${dataFormatada}</span> - <span>${resposta[0].horaAula}</span>`
                })
            }else{
                throw ('Erro ao buscar aulas')
            }
        }).catch(error=>{
            console.error("Deu erro para buscar a aula")
        })
    }

    function exibirPresenca() {
        let selector = document.querySelector('input[name="aulaRealizada"]:checked').value;
        iptPresenca = document.getElementById("inputPresenca")
        if (selector == 1) {
            iptPresenca.style.display = 'block'
        } else {
            iptPresenca.style.display = 'none'
        }
    }

    function editarAula() {
        let presencaVar = selectPresenca.value
        let realizadaVar = document.querySelector('input[name="aulaRealizada"]:checked').value;

        if (realizadaVar == 1) {
            fetch(`/aulas/editarAula/${sessionStorage.ID_AULA_EDITAR}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    presencaServer: presencaVar,
                    realizadaServer: realizadaVar,
                })
            }).then(response=>{
                if(response.ok){
                    alert('Aula editada com sucesso')
                    window.location.href='aulasPage.html'
                }else{
                    throw ("Houve um erro ao editar a aula")
                }
            }).catch(error=>{
                console.error('Houve um erro ao realizar a edição: ', error)
            })
        } else {
            window.location.href='aulasPage.html'
        }


    }
</script>
