<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJORCLASSAPP - INITIALPAGE</title>
    <link rel="stylesheet" href="../css/appStyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<script src="../../js/script.js"></script>

<body onload="buscarAlunos()">
    <div class="header">
        <img src="../../img/LOGOIMAGE_INVERTIDO.png" alt="" onclick="window.location.href='../initialPage.html'">
        <div class="linksContainer">
            <div class="navBarLink">
                <a href="../alunos/alunosPage.html">
                    <img src="../../img/User/Users.png" alt="">
                    <p>ALUNOS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="aulasPage.html">
                    <img src="../../img/Calendar/Calendar_Days.svg" alt="">
                    <p>AULAS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../relatorios/qtdAlunos.html">
                    <img src="../../img/Interface/Chart_Line.svg" alt="">
                    <p>RELATÓRIOS</p>
                </a>
            </div>
            <div class="exitButton">
                <a href="../../index.html">
                    <img src="../../img/Vector.png" alt="">
                    <span>SAIR</span>
                </a>
            </div>
        </div>
    </div>
    <div class="mainRegister">
        <h1>
            EDITAR AULA
        </h1>
        <div class="registerForm">
            <div class="inputContainer">
                <div class="inputField">
                    <p>Aluno: </p>
                    <select name="" id="selectAluno">
                        <option value=""></option>
                    </select>   
                </div>
                <div class="inputField">
                    <p>Data: </p>
                    <input type="date" placeholder="dd/mm/yyyy">
                </div>
                <div class="inputField">
                    <p>Hora: </p>
                    <input type="time" placeholder="00:00">
                </div>
                <div class="inputField">
                    <p>Presença: </p>
                    <select name="" id="selectPresenca">
                        <option value="'PRESENTE'">PRESENTE</option>
                        <option value="'AUSENTE'">AUSENTE</option>
                        <option value="'FALTA JUSTIFICADA'">FALTA JUSTIFICADA</option>
                    </select>
                </div>
                <div class="inputField">
                    <p>Aula realizada: </p>
                    <div class="radioSelect">
                        <div class="radioOpt"><input type="radio" name="aulaRealizada" value="1" id="radioSim"><span>SIM</span></div>
                        <div class="radioOpt"><input type="radio" name="aulaRealizada" value="0" id="radioNao"><span>NÃO</span></div>
                    </div>
                </div>
            </div>
            <button onclick="window.location.href='aulasPage.html'">EDITAR ALUNO</button>
        </div>
    </div>
</body>

</html>
