<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJORCLASSAPP - INITIALPAGE</title>
    <link rel="stylesheet" href="../css/appStyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<script src="../../js/script.js"></script>

<body onload="buscarAlunos()">
    <div class="header">
        <img src="../../img/LOGOIMAGE_INVERTIDO.png" alt="" onclick="window.location.href='../initialPage.html'">
        <div class="linksContainer">
            <div class="navBarLink">
                <a href="../alunos/alunosPage.html">
                    <img src="../../img/User/Users.png" alt="">
                    <p>ALUNOS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="aulasPage.html">
                    <img src="../../img/Calendar/Calendar_Days.svg" alt="">
                    <p>AULAS</p>
                </a>
            </div>
            <div class="navBarLink">
                <a href="../relatorios/qtdAlunos.html">
                    <img src="../../img/Interface/Chart_Line.svg" alt="">
                    <p>RELATÓRIOS</p>
                </a>
            </div>
            <div class="exitButton">
                <a href="../../index.html">
                    <img src="../../img/Vector.png" alt="">
                    <span>SAIR</span>
                </a>
            </div>
        </div>
    </div>
    <div class="mainContent">
        <h1>
            ADICIONAR AULA
        </h1>
        <div class="registerForm formCadastro">
            <div class="inputContainer">
                <div class="inputField">
                    <p>Aluno: </p>
                    <select name="" id="selectAluno">
                    </select>   
                </div>
                <div class="inputField">
                    <p>Data: </p>
                    <input type="date" placeholder="dd/mm/yyyy" id="dateInp">
                </div>
                <div class="inputField">
                    <p>Hora: </p>
                    <input type="time" placeholder="00:00" id="horaInp">
                </div>
            </div>
            <button onclick="cadastrarAula()">ADICIONAR ALUNO</button>
        </div>
    </div>
</body>
</html>
<script>
    function cadastrarAula(){
        let fkAlunoVar = selectAluno.value
        let dataAulaVar = dateInp.value
        let horaAulaVar = horaInp.value
        fetch(`/aulas/cadastrarAula`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                fkAlunoServer: fkAlunoVar,
                dataAulaServer: dataAulaVar,
                horaAulaServer: horaAulaVar,
            }),
        }).then(response=>{
            if(response.ok){
                alert("Aula cadastrada com sucesso!")
                window.location.href='aulasPage.html'
            }else{
                throw("Houve um erro ao cadastrar a aula")
            }
        }).catch(error=>{
            console.error("Houve um erro ao cadastrar", error)
        })
    }
</script>
